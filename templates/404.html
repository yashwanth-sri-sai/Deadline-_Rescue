{% extends "base.html" %}

{% block title %}Not Found — Deadline Rescue{% endblock %}

{% block content %}
<div class="container-xl py-5 text-center">
    <div class="card clay-card p-5 mx-auto" style="max-width: 540px;">
        <div class="empty-state-icon-container mb-3 mx-auto text-danger">
            <i class="bi bi-exclamation-triangle-fill"></i>
        </div>
        <h1 class="h3 fw-bold text-slate-900 mb-2">Task or Page Not Found</h1>
        <p class="text-secondary small mb-4">
            The requested task or page could not be found or has been removed.
        </p>
        <div>
            <a href="{{ url_for('list_tasks') }}" class="btn btn-primary-custom" id="btn-notfound-return">
                <i class="bi bi-arrow-left me-1"></i>Return to Tasks
            </a>
        </div>
    </div>
</div>
{% endblock %}
